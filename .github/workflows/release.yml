name: Release

on:
  push:
    branches:
      - main
      - rc/**
      - rc-*
      - beta/**
      - beta-*
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use an admin-owned PAT so semantic-release can push the
          # chore(release) commit + tag to the protected main branch
          # (the admin identity is on the branch-protection bypass list).
          # Falls back to the default token when RELEASE_TOKEN is unset, so
          # non-releasing pushes (and forks) still check out cleanly.
          # See docs/maintainer-runbook.md for how to create this secret.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run semantic-release
        env:
          # Admin-owned PAT (RELEASE_TOKEN) so the release commit/tag can be
          # pushed past branch protection; falls back to the default token if
          # the secret is unset (e.g. forks), where protection does not apply.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

